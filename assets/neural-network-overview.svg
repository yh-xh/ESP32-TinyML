<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-label="神经网络整体架构：输入、特征提取、融合压缩、决策、输出">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="960" fill="#FFFFFF"/>

  <text x="600" y="56" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0F172A">神经网络整体架构</text>
  <text x="600" y="88" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">从输入到输出的一条流水线；同一段结构通常会重复多组</text>

  <!-- 输入 -->
  <rect x="420" y="110" width="360" height="56" rx="28" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#3730A3">输入：图像 / 序列 / 向量</text>
  <line x1="600" y1="166" x2="600" y2="190" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 特征提取 -->
  <rect x="80" y="196" width="1040" height="210" rx="18" fill="#F8FAFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="104" y="230" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">① 特征提取（Backbone）</text>
  <text x="1096" y="230" text-anchor="end" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">重复多组：尺寸变小、通道变多</text>

  <rect x="110" y="252" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="210" y="280" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">卷积</text>
  <text x="210" y="302" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">提取局部图案</text>
  <line x1="310" y1="284" x2="334" y2="284" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="252" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">BN</text>
  <text x="430" y="302" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">稳定数值</text>
  <line x1="520" y1="284" x2="544" y2="284" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="252" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="650" y="280" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">激活</text>
  <text x="650" y="302" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">ReLU / SiLU</text>
  <line x1="750" y1="284" x2="774" y2="284" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="780" y="252" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="880" y="280" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">池化 / 步长卷积</text>
  <text x="880" y="302" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">下采样</text>

  <rect x="110" y="332" width="470" height="44" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="345" y="360" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1E40AF">残差连接：把输入直接加到输出（跨层直连）</text>

  <line x1="600" y1="406" x2="600" y2="440" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 融合 / 压缩 -->
  <rect x="80" y="446" width="1040" height="180" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="104" y="480" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#15803D">② 融合 / 压缩（Neck / GAP）</text>

  <rect x="110" y="502" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="260" y="530" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#166534">Concat / Add</text>
  <text x="260" y="552" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">合并多路特征</text>
  <line x1="410" y1="534" x2="434" y2="534" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="502" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="570" y="530" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#166534">1×1 卷积</text>
  <text x="570" y="552" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">通道升 / 降维</text>
  <line x1="700" y1="534" x2="724" y2="534" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="502" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="880" y="530" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#166534">GAP</text>
  <text x="880" y="552" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">每个通道压成一个数</text>

  <text x="104" y="602" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">多尺度特征在这里汇合；分类网络通常以 GAP 收尾</text>

  <line x1="600" y1="626" x2="600" y2="660" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策 -->
  <rect x="80" y="666" width="1040" height="170" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="104" y="700" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#C2410C">③ 决策（Head）</text>

  <rect x="110" y="722" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="280" y="750" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#9A3412">全连接 / 卷积检测头</text>
  <text x="280" y="772" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">输出类别或框</text>
  <line x1="450" y1="754" x2="474" y2="754" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="722" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="630" y="750" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#9A3412">Softmax / Sigmoid</text>
  <text x="630" y="772" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">分数变成概率</text>

  <text x="810" y="754" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">检测网络还会接后处理</text>
  <text x="810" y="776" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">（解码框 + NMS）</text>

  <line x1="600" y1="836" x2="600" y2="864" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 输出 -->
  <rect x="390" y="870" width="420" height="56" rx="28" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="600" y="905" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#5B21B6">输出：类别概率 / 目标框 / 数值</text>
</svg>
